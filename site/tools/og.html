<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#17181c;color:#f3f2ee;font-family:-apple-system,system-ui;overflow:hidden;position:relative;
background-image:radial-gradient(90% 70% at 15% 0%,rgba(224,124,84,.20),transparent 60%),radial-gradient(80% 70% at 100% 100%,rgba(242,201,76,.16),transparent 55%)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:40px;padding:64px;text-align:center}
.name{display:flex;align-items:center;gap:16px;font-size:34px;font-weight:600;letter-spacing:-.01em}
h1{font-size:46px;line-height:1.3;font-weight:600;letter-spacing:-.02em;max-width:940px}
p{font-size:25px;color:#bebec3;max-width:900px;line-height:1.5}
.strip{display:inline-flex;align-items:center;gap:14px;height:56px;padding:0 20px 0 16px;border-radius:16px;
background:linear-gradient(to bottom,rgba(43,43,46,.92),rgba(18,18,20,.96));box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 0 0 2px rgba(255,255,255,.1),0 12px 34px rgba(0,0,0,.5);
font-size:26px;font-variant-numeric:tabular-nums;color:#bebec3}
.grip{display:grid;grid-template-columns:repeat(2,4px);gap:5px}
.grip i{width:4px;height:4px;border-radius:50%;background:rgba(190,190,195,.5)}
.dot{width:8px;height:8px;border-radius:50%;background:#e07c54;margin:0 3px 14px 2px}
.tag{border-radius:5px;padding:3px 7px}
.y{background:#f2c94c;color:#1c1c1e}.r{background:#d93025;color:#fff}
.foot{font-size:22px;color:rgba(190,190,195,.75)}
</style></head><body><div class="wrap">
<div class="name"><svg width="52" height="16" viewBox="0 0 52 16"><polygon points="0,16 30,16 34,0 0,0" fill="#8b8e97"/><polygon points="38,16 52,16 52,0 42,0" fill="#f2c94c"/></svg>Hachibu</div>
<h1>I spend a worrying amount of my life<br>checking how many tokens I have left.</h1>
<span class="strip"><span class="grip"><i></i><i></i><i></i><i></i><i></i><i></i></span><span style="display:flex;align-items:flex-start">Opus5<span class="dot"></span>&nbsp;xhigh&nbsp;·</span><span>S42</span><span class="tag y">W76</span><span class="tag r">F93</span></span>
<p>A small strip on top of your Mac's screen. Model, effort, and usage limits, without opening anything.</p>
<div class="foot">cc-hachibu.vercel.app · Free and open source · macOS 14+</div>
</div></body></html>
