# Windows向けのリリース。mainで手動で起動する（Actions > Release Windows > Run workflow）。
#
# windows/build.shのVERSIONをバージョンとし、docs/releases/windows-v<バージョン>.mdをリリースの本文にする。
# テストが通ったら、x64向けのHachibu.exeを組み立ててzipにし、タグwindows-v<バージョン>とリリースを作る。
# zipとscripts/statusline.sh、scripts/statusline.ps1を添付し、本文の末尾にSHA-256を足す。
# macOS向けの新しいバージョンの確認とREADMEのダウンロードの案内は/releases/latestを見るので、Windows向けのリリースは「最新」にしない
name: Release Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # 別のブランチを選んで起動しても、mainでなければ何もしない
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # 組み立ての途中で外部のツール（go-winres）を動かすので、書き込みのできるトークンをgitの設定に残さない。
      # リリースを作るghには、その手順でだけGH_TOKENを渡す
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: windows/go.mod
          cache-dependency-path: windows/go.sum
      - name: Read the version
        id: version
        run: |
          VERSION="$(sed -n 's/^VERSION="\(.*\)"$/\1/p' windows/build.sh)"
          NOTES="docs/releases/windows-v${VERSION}.md"
          test -n "$VERSION"
          test -f "$NOTES" || { echo "missing $NOTES" >&2; exit 1; }
          if gh release view "windows-v${VERSION}" >/dev/null 2>&1; then
            echo "windows-v${VERSION} is already released" >&2
            exit 1
          fi
          # タグだけが残っていると、gh release createはそれを使い、別のコミットのタグに今回のアプリを添付してしまう
          if git ls-remote --exit-code --tags origin "refs/tags/windows-v${VERSION}" >/dev/null; then
            echo "tag windows-v${VERSION} already exists" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Test
        working-directory: windows
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          go test ./...
      - name: Build
        run: windows/build.sh --zip
      - name: Create the release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP=windows/build/Hachibu-windows-x64.zip
          { cat "${{ steps.version.outputs.notes }}"; echo; echo "SHA-256"; echo '```'; (cd windows/build && sha256sum Hachibu-windows-x64.zip); (cd scripts && sha256sum statusline.sh statusline.ps1); echo '```'; } > "$RUNNER_TEMP/notes.md"
          gh release create "windows-v${VERSION}" "$ZIP" scripts/statusline.sh scripts/statusline.ps1 \
            --target "$GITHUB_SHA" --title "Hachibu for Windows ${VERSION}" --notes-file "$RUNNER_TEMP/notes.md" --latest=false
        env:
          GH_TOKEN: ${{ github.token }}
      # windows/README.mdのダウンロードのリンクはバージョンを含み、リリースができてから上げる。まだ前のバージョンを指していれば、上げ忘れないよう知らせる
      - name: Remind to update the download links
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # 英日のどのリンク（zip、statusline.sh、statusline.ps1）でも、別のバージョンを指すものが1つでも残っていれば知らせる
          STALE="$(grep -o 'releases/download/windows-v[^/]*/[^)" ]*' windows/README.md | grep -v -F "releases/download/windows-v${VERSION}/" || true)"
          if [ -n "$STALE" ]; then
            MSG="Released windows-v${VERSION}. $(echo "$STALE" | wc -l | tr -d ' ') download links in windows/README.md still point to another version; update them to windows-v${VERSION}."
            echo "::warning::${MSG}"
            { echo "${MSG}"; echo; echo '```'; echo "$STALE" | sort | uniq -c; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
