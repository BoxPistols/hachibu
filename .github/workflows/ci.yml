# テストとアプリの組み立て。アプリはAppKitを使うので、macOSのランナーで動かす
name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["site/**", "docs/**", "README.md"]
  pull_request:
    paths-ignore: ["site/**", "docs/**", "README.md"]

# どのジョブもリポジトリに書き込まない。チェックアウト後にリポジトリのスクリプトを動かすので、トークンは読み取りだけにし、ワークツリーにも残さない
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Swift version
        run: swift --version
      - name: Test
        run: scripts/test.sh
      - name: Build the app
        run: scripts/build-app.sh --zip
      # リリースと同じ macOS 15 の SDK で作った zip を残す。タグを打つ前に、これを古い macOS の実機で開いて確かめる
      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: Hachibu-macos
          path: build/Hachibu-macos.zip
          retention-days: 14
      - name: Build the App Store variant
        run: scripts/build-app.sh --app-store
      - name: Build Hachibu Lite
        run: lite/build.sh

  # macOS 13で使えるSwift 5.9でもビルドが通ることを確かめる（README のビルド要件）。
  # GitHubのmacOS 13のランナーは提供が終わったので、macOS 14のランナーでXcode 15.2（Swift 5.9.2）を選ぶ。
  # テストはSwift 6が要るので、ここではビルドだけ
  build-swift59:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Select Xcode 15.2
        run: sudo xcode-select -s /Applications/Xcode_15.2.app
      - name: Swift version
        run: swift --version
      - name: Build the app
        run: scripts/build-app.sh
      - name: Build the App Store variant
        run: scripts/build-app.sh --app-store
      - name: Build Hachibu Lite
        run: lite/build.sh
